<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0;font-family:var(--font-sans,system-ui,sans-serif)}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.nav-title{flex:1;font-size:15px;font-weight:500;color:var(--color-text-primary,#1a1a1a);text-align:center}
.nav button{border:0.5px solid var(--color-border-secondary,#ddd);background:transparent;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--color-text-primary,#1a1a1a)}
.nav button:hover{background:var(--color-background-secondary,#f5f5f5)}
.phase-pill{font-size:11px;font-weight:500;padding:2px 10px;border-radius:20px;margin:0 auto 0.75rem;display:inline-block}
.ph1{background:#E1F5EE;color:#0F6E56}.ph2{background:#E6F1FB;color:#185FA5}.ph3{background:#FAEEDA;color:#854F0B}.ph4{background:#FAECE7;color:#993C1D}
.col-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day-hdr{font-size:11px;font-weight:500;color:var(--color-text-secondary,#666);text-align:center;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary,#eee);margin-bottom:3px}
.day-cell{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#eee);border-radius:10px;padding:7px 5px;min-height:105px;display:flex;flex-direction:column;gap:3px}
.day-cell.true-rest{background:var(--color-background-secondary,#f9f9f9);border-style:dashed;justify-content:center;align-items:center}
.chip{font-size:10px;font-weight:500;padding:2px 5px;border-radius:20px;line-height:1.4;text-align:center;word-break:break-word}
.c-run-easy{background:#EAF3DE;color:#3B6D11}
.c-run-tempo{background:#E6F1FB;color:#185FA5}
.c-run-long{background:#EEEDFE;color:#534AB7}
.c-run-int{background:#FAEEDA;color:#854F0B}
.c-run-race{background:#FAECE7;color:#993C1D}
.c-yoga-flow{background:#FBEAF0;color:#993556}
.c-yoga-yin{background:#F4C0D1;color:#72243E}
.c-pilates{background:#E1F5EE;color:#085041}
.c-hip{background:#EEEDFE;color:#534AB7}
.c-core{background:#FAC775;color:#633806}
.detail{font-size:10px;color:var(--color-text-secondary,#666);line-height:1.4;margin-top:1px}
.rest-label{font-size:11px;color:var(--color-text-tertiary,#aaa);text-align:center}
.wt-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:0.75rem}
.wt{font-size:11px;padding:3px 8px;border-radius:20px;border:0.5px solid var(--color-border-secondary,#ddd);background:transparent;color:var(--color-text-secondary,#666);cursor:pointer}
.wt.active{background:var(--color-background-secondary,#f5f5f5);color:var(--color-text-primary,#1a1a1a);font-weight:500;border-color:var(--color-border-primary,#aaa)}
.phase-bar{display:flex;gap:4px;margin-bottom:0.75rem}
.pb{flex:1;text-align:center;font-size:10px;padding:4px 2px;border-radius:6px;cursor:pointer;border:0.5px solid transparent}
.pb.sel{border-color:var(--color-border-primary,#aaa)}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:0.85rem}
.focus-note{font-size:12px;color:var(--color-text-secondary,#666);background:var(--color-background-secondary,#f9f9f9);border-radius:6px;padding:7px 12px;margin-bottom:0.75rem;line-height:1.6}
.change-note{font-size:11px;color:#854F0B;background:#FAEEDA;border-radius:6px;padding:5px 10px;margin-bottom:0.6rem;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<div class="phase-bar" id="phaseBar"></div>
<div class="wt-row" id="weekTabs"></div>
<div class="nav">
  <button onclick="changeWeek(-1)">&#8592;</button>
  <div class="nav-title" id="navTitle"></div>
  <button onclick="changeWeek(1)">&#8594;</button>
</div>
<div id="phaseLabel" style="text-align:center;margin-bottom:0.6rem"></div>
<div id="changeNote"></div>

<div class="col-grid">

  <div class="day-hdr">Thu</div><div class="day-hdr">Fri</div><div class="day-hdr">Sat</div><div class="day-hdr">Sun</div>
</div>
<div class="col-grid" id="calGrid" style="margin-top:4px"></div>
<div class="legend" id="legend"></div>
</div>

let cur=0;

function renderPhaseBar(){
  const bar=document.getElementById('phaseBar');
  bar.innerHTML='';
  PHASES.forEach(p=>{
    const b=document.createElement('div');
    b.className='pb '+p.cls+(p.weeks.includes(cur+1)?' sel':'');
    b.textContent=p.label;
    b.onclick=()=>{cur=p.weeks[0]-1;render()};
    bar.appendChild(b);
  });
}

function renderTabs(){
  const t=document.getElementById('weekTabs');
  t.innerHTML='';
  weeks.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='wt'+(i===cur?' active':'');
    b.textContent='W'+(i+1);
    b.onclick=()=>{cur=i;render()};
    t.appendChild(b);
  });
}

function render(){
  const w=weeks[cur];
  document.getElementById('navTitle').textContent='Week '+(cur+1)+' of 15';
  const pInfo=PHASES.find(p=>p.weeks.includes(cur+1));
  document.getElementById('phaseLabel').innerHTML=`<span class="phase-pill ${pInfo.cls}">${pInfo.label} — ${w.label}</span>`;

  const cn=document.getElementById('changeNote');
  cn.innerHTML=w.change?`<div class="change-note">${w.change}</div>`:'';

  document.getElementById('focusNote').textContent=w.focus;

  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  w.days.forEach(day=>{
    const cell=document.createElement('div');
    if(day.rest){
      cell.className='day-cell true-rest';
      cell.innerHTML='<span class="rest-label">full rest</span>';
    } else if(day.raceDay){
      cell.className='day-cell';
      cell.style.borderColor='#D85A30';
      if(day.run) cell.innerHTML+=`<span class="chip ${day.run.t}">${day.run.l}</span><span class="detail">${day.run.d}</span>`;
    } else {
      cell.className='day-cell';
      if(day.run) cell.innerHTML+=`<span class="chip ${day.run.t}">${day.run.l}</span><span class="detail">${day.run.d}</span>`;
      if(day.yoga) cell.innerHTML+=`<span class="chip ${day.yoga.t}">${day.yoga.l}</span><span class="detail">${day.yoga.d}</span>`;
    }
    grid.appendChild(cell);
  });

  renderPhaseBar();
  renderTabs();

  document.getElementById('legend').innerHTML=[
    ['c-run-easy','Easy run'],['c-run-tempo','Tempo'],['c-run-long','Long run'],
    ['c-run-int','Intervals'],['c-run-race','Race'],
    ['c-hip','Hip focus'],['c-core','Core/pilates'],['c-yoga-flow','Yoga flow'],['c-yoga-yin','Yin yoga'],
  ].map(([c,l])=>`<span class="chip ${c}">${l}</span>`).join('');
}

function changeWeek(d){cur=Math.max(0,Math.min(14,cur+d));render();}
render();
</script>
</body>
</html>
